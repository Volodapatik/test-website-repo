<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Supercar Experience | Volodymyr Patyk</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Outfit:wght@300;400;600;700&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00f2fe;
            --secondary: #4facfe;
            --accent: #ff0055;
            --neon-green: #00ff66;
            --bg-dark: #05070f;
            --hud-bg: rgba(10, 14, 26, 0.75);
            --hud-border: rgba(0, 242, 254, 0.3);
            --font-display: 'Orbitron', sans-serif;
            --font-main: 'Outfit', sans-serif;
            --font-mono: 'Fira Code', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-dark);
            font-family: var(--font-main);
            color: #ffffff;
        }

        #webgl-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Top HUD Header */
        header {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
        }

        .brand-logo {
            pointer-events: auto;
            background: var(--hud-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--hud-border);
            padding: 12px 20px;
            border-radius: 14px;
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.15);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-display);
            font-weight: 900;
            font-size: 1.1rem;
            color: #000;
            box-shadow: 0 0 10px var(--primary);
        }

        .brand-text h1 {
            font-family: var(--font-display);
            font-size: 1rem;
            letter-spacing: 1.5px;
            background: linear-gradient(90deg, #fff, var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        .brand-text p {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.6);
            font-family: var(--font-mono);
        }

        .top-actions {
            pointer-events: auto;
            display: flex;
            gap: 10px;
        }

        .hud-btn {
            background: var(--hud-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--hud-border);
            color: #fff;
            padding: 10px 16px;
            border-radius: 10px;
            font-family: var(--font-display);
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .hud-btn:hover, .hud-btn.active {
            background: var(--primary);
            color: #000;
            box-shadow: 0 0 15px var(--primary);
            border-color: var(--primary);
        }

        /* Control Panel (Sidebar) */
        .controls-panel {
            position: absolute;
            right: 20px;
            top: 90px;
            width: 310px;
            z-index: 10;
            background: var(--hud-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--hud-border);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .controls-panel.collapsed {
            transform: translateX(350px);
        }

        .panel-title {
            font-family: var(--font-display);
            font-size: 0.9rem;
            color: var(--primary);
            letter-spacing: 1px;
            text-transform: uppercase;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 10px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .control-label {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.7);
            display: flex;
            justify-content: space-between;
        }

        .color-presets {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 8px;
        }

        .color-dot {
            width: 100%;
            aspect-ratio: 1;
            border-radius: 8px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: transform 0.2s, border-color 0.2s;
        }

        .color-dot:hover, .color-dot.active {
            transform: scale(1.15);
            border-color: #fff;
            box-shadow: 0 0 10px currentColor;
        }

        .toggle-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .toggle-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: rgba(255, 255, 255, 0.8);
            padding: 8px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-family: var(--font-display);
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
        }

        .toggle-btn.active {
            background: rgba(0, 242, 254, 0.2);
            border-color: var(--primary);
            color: var(--primary);
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.3);
        }

        /* Bottom Speedometer HUD */
        .dashboard-hud {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            align-items: flex-end;
            gap: 20px;
            pointer-events: none;
        }

        .speedometer {
            background: var(--hud-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--hud-border);
            padding: 15px 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.6);
            min-width: 180px;
        }

        .speed-val {
            font-family: var(--font-display);
            font-size: 3.2rem;
            font-weight: 900;
            color: #fff;
            line-height: 1;
            text-shadow: 0 0 15px var(--primary);
        }

        .speed-unit {
            font-family: var(--font-mono);
            font-size: 0.75rem;
            color: var(--primary);
            letter-spacing: 2px;
            margin-top: 4px;
        }

        .rpm-bar-container {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            margin-top: 10px;
            overflow: hidden;
        }

        .rpm-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            transition: width 0.1s linear;
        }

        .drive-hint {
            background: var(--hud-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--hud-border);
            padding: 12px 20px;
            border-radius: 14px;
            font-family: var(--font-mono);
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.8);
            display: flex;
            align-items: center;
            gap: 10px;
            pointer-events: auto;
        }

        .key-badge {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 4px 8px;
            border-radius: 6px;
            font-family: var(--font-display);
            font-size: 0.75rem;
            color: var(--primary);
            box-shadow: 0 2px 0 rgba(0, 0, 0, 0.4);
        }

        /* Mobile Controls Overlay */
        .mobile-controls {
            position: absolute;
            bottom: 25px;
            left: 20px;
            z-index: 10;
            display: none;
            gap: 10px;
        }

        .pedal-btn {
            width: 60px;
            height: 60px;
            border-radius: 14px;
            background: var(--hud-bg);
            border: 1px solid var(--hud-border);
            color: #fff;
            font-family: var(--font-display);
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(10px);
        }

        .pedal-btn:active {
            background: var(--primary);
            color: #000;
        }

        @media (max-width: 768px) {
            .mobile-controls { display: flex; }
            .controls-panel {
                width: 260px;
                right: 10px;
                top: 80px;
            }
            .drive-hint { display: none; }
        }

        /* Loading Screen */
        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #03050a;
            z-index: 999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            transition: opacity 0.8s ease;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(0, 242, 254, 0.1);
            border-top-color: var(--primary);
            border-bottom-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s infinite linear;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        .loader-title {
            font-family: var(--font-display);
            font-size: 1.2rem;
            letter-spacing: 3px;
            color: var(--primary);
            text-transform: uppercase;
        }
    </style>
    <!-- Three.js & OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <!-- Loading Screen -->
    <div id="loader">
        <div class="spinner"></div>
        <div class="loader-title">Завантаження 3D Моделі Supercar...</div>
    </div>

    <!-- 3D Canvas -->
    <div id="webgl-container"></div>

    <!-- Top Header HUD -->
    <header>
        <div class="brand-logo">
            <div class="brand-icon">VP</div>
            <div class="brand-text">
                <h1>Cyber Roadster 3D</h1>
                <p>Volodymyr Patyk • Showcase</p>
            </div>
        </div>

        <div class="top-actions">
            <button class="hud-btn" id="audioToggleBtn">
                🔊 SFX: OFF
            </button>
            <button class="hud-btn" id="panelToggleBtn">
                🎨 Налаштування
            </button>
        </div>
    </header>

    <!-- Settings Controls Sidebar -->
    <div class="controls-panel" id="controlsPanel">
        <div class="panel-title">
            <span>⚙️ Гараж & Стиль</span>
        </div>

        <!-- Color Picker -->
        <div class="control-group">
            <div class="control-label">
                <span>Колір кузова:</span>
                <span id="colorName">Cyber Cyan</span>
            </div>
            <div class="color-presets">
                <div class="color-dot active" style="background: #00f2fe;" data-color="#00f2fe" data-name="Cyber Cyan"></div>
                <div class="color-dot" style="background: #ff0055;" data-color="#ff0055" data-name="Apex Red"></div>
                <div class="color-dot" style="background: #9d00ff;" data-color="#9d00ff" data-name="Neon Violet"></div>
                <div class="color-dot" style="background: #ffaa00;" data-color="#ffaa00" data-name="Gold Flare"></div>
                <div class="color-dot" style="background: #00ff66;" data-color="#00ff66" data-name="Emerald Green"></div>
                <div class="color-dot" style="background: #111520;" data-color="#111520" data-name="Stealth Black"></div>
            </div>
        </div>

        <!-- Camera Views -->
        <div class="control-group">
            <div class="control-label">Ракурс камери:</div>
            <div class="toggle-grid">
                <button class="toggle-btn active" data-cam="orbit">360° Огляд</button>
                <button class="toggle-btn" data-cam="front">Спереду</button>
                <button class="toggle-btn" data-cam="cockpit">Салон</button>
                <button class="toggle-btn" data-cam="wheel">Колесо</button>
            </div>
        </div>

        <!-- Toggles -->
        <div class="control-group">
            <div class="control-label">Ефекти та Підсвітка:</div>
            <div class="toggle-grid">
                <button class="toggle-btn active" id="headlightsToggle">💡 Фари: ON</button>
                <button class="toggle-btn active" id="neonToggle">✨ Неон: ON</button>
            </div>
        </div>

        <!-- Environment Mode -->
        <div class="control-group">
            <div class="control-label">Локація:</div>
            <div class="toggle-grid">
                <button class="toggle-btn active" data-env="cyber">Cyber Grid</button>
                <button class="toggle-btn" data-env="sunset">Sunset Neon</button>
            </div>
        </div>
    </div>

    <!-- Dashboard HUD -->
    <div class="dashboard-hud">
        <div class="drive-hint">
            <span>Затисніть</span>
            <span class="key-badge">W</span>
            <span>або</span>
            <span class="key-badge">▲</span>
            <span>щоб розгоняти суперкар!</span>
        </div>

        <div class="speedometer">
            <div class="speed-val" id="speedDisplay">000</div>
            <div class="speed-unit">KM / H</div>
            <div class="rpm-bar-container">
                <div class="rpm-bar-fill" id="rpmBar"></div>
            </div>
        </div>
    </div>

    <!-- Mobile Controls -->
    <div class="mobile-controls">
        <button class="pedal-btn" id="gasPedal">🚀</button>
    </div>

    <script>
        // -------------------------------------------------------------
        // Global Variables & Three.js Setup
        // -------------------------------------------------------------
        const container = document.getElementById('webgl-container');
        let scene, camera, renderer, controls;
        let carGroup, bodyMesh, wheelMeshes = [], headlightPointLights = [], neonLights = [];
        let roadGrid, speedDust;

        let speed = 0;
        let maxSpeed = 320;
        let acceleration = 0;
        let isAccelerating = false;
        let targetSpeed = 0;

        let soundEnabled = false;
        let audioCtx = null;
        let engineOscillator = null, engineGain = null;

        // Colors
        let bodyMaterial, wheelMaterial, glassMaterial, glowMaterial;

        // Initialize Scene
        function init() {
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x05070f, 0.015);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(4.5, 2.2, 5.5);

            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.2;
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2 + 0.02; // Don't go far below ground
            controls.minDistance = 2.5;
            controls.maxDistance = 15;
            controls.target.set(0, 0.6, 0);

            // Setup Lights
            setupLights();

            // Build Car Model
            createSupercar();

            // Setup Road & Environment
            createEnvironment();

            // Window Resize
            window.addEventListener('resize', onWindowResize);

            // Hide Loader
            setTimeout(() => {
                document.getElementById('loader').style.opacity = '0';
                setTimeout(() => document.getElementById('loader').style.display = 'none', 800);
            }, 500);

            // Animation Loop
            animate();
        }

        // -------------------------------------------------------------
        // Lighting Setup
        // -------------------------------------------------------------
        function setupLights() {
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
            dirLight.position.set(10, 20, 10);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 2048;
            dirLight.shadow.mapSize.height = 2048;
            scene.add(dirLight);

            // Dynamic Cyber Lights
            const cyanLight = new THREE.PointLight(0x00f2fe, 2, 20);
            cyanLight.position.set(-5, 3, -5);
            scene.add(cyanLight);

            const magentaLight = new THREE.PointLight(0xff0055, 2, 20);
            magentaLight.position.set(5, 3, 5);
            scene.add(magentaLight);
        }

        // -------------------------------------------------------------
        // Build Procedural 3D Supercar Model
        // -------------------------------------------------------------
        function createSupercar() {
            carGroup = new THREE.Group();

            // Materials
            bodyMaterial = new THREE.MeshPhysicalMaterial({
                color: 0x00f2fe,
                metalness: 0.85,
                roughness: 0.15,
                clearcoat: 1.0,
                clearcoatRoughness: 0.1,
                reflectivity: 1.0
            });

            const carbonMaterial = new THREE.MeshStandardMaterial({
                color: 0x111113,
                roughness: 0.6,
                metalness: 0.5
            });

            glassMaterial = new THREE.MeshPhysicalMaterial({
                color: 0x050814,
                metalness: 0.1,
                roughness: 0.05,
                transmission: 0.6,
                transparent: true,
                opacity: 0.85
            });

            const chromeMaterial = new THREE.MeshStandardMaterial({
                color: 0xeeeeee,
                metalness: 0.95,
                roughness: 0.1
            });

            glowMaterial = new THREE.MeshBasicMaterial({ color: 0xffffff });

            // 1. Lower Chassis & Side Skirts
            const chassisGeo = new THREE.BoxGeometry(1.9, 0.25, 4.2);
            const chassis = new THREE.Mesh(chassisGeo, carbonMaterial);
            chassis.position.y = 0.25;
            chassis.castShadow = true;
            carGroup.add(chassis);

            // 2. Main Sleek Body
            const bodyShape = new THREE.Shape();
            bodyShape.moveTo(-0.95, -2.1);
            bodyShape.lineTo(0.95, -2.1);
            bodyShape.lineTo(0.9, 2.0);
            bodyShape.lineTo(-0.9, 2.0);
            
            const extrudeSettings = { depth: 0.55, bevelEnabled: true, bevelSegments: 4, steps: 2, bevelSize: 0.1, bevelThickness: 0.1 };
            const mainBodyGeo = new THREE.ExtrudeGeometry(bodyShape, extrudeSettings);
            mainBodyGeo.rotateX(Math.PI / 2);
            bodyMesh = new THREE.Mesh(mainBodyGeo, bodyMaterial);
            bodyMesh.position.y = 0.45;
            bodyMesh.castShadow = true;
            carGroup.add(bodyMesh);

            // 3. Cabin / Glass Roof Dome
            const cabinGeo = new THREE.ConeGeometry(0.85, 1.8, 4);
            cabinGeo.rotateX(Math.PI / 2);
            cabinGeo.scale(1.0, 0.4, 1.2);
            const cabin = new THREE.Mesh(cabinGeo, glassMaterial);
            cabin.position.set(0, 0.85, -0.1);
            carGroup.add(cabin);

            // 4. Rear Spoiler Wing
            const wingGeo = new THREE.BoxGeometry(1.8, 0.05, 0.35);
            const wing = new THREE.Mesh(wingGeo, carbonMaterial);
            wing.position.set(0, 0.95, -1.9);

            const strutGeo = new THREE.BoxGeometry(0.06, 0.25, 0.15);
            const strutL = new THREE.Mesh(strutGeo, carbonMaterial);
            strutL.position.set(-0.6, 0.8, -1.9);
            const strutR = strutL.clone();
            strutR.position.x = 0.6;

            carGroup.add(wing);
            carGroup.add(strutL);
            carGroup.add(strutR);

            // 5. LED Headlights
            const headGeo = new THREE.BoxGeometry(0.4, 0.08, 0.1);
            const headlightL = new THREE.Mesh(headGeo, glowMaterial);
            headlightL.position.set(-0.6, 0.45, 2.02);
            const headlightR = headlightL.clone();
            headlightR.position.x = 0.6;

            carGroup.add(headlightL);
            carGroup.add(headlightR);

            // Point Lights for Headlights Projection
            const pLightL = new THREE.SpotLight(0xffffff, 4, 15, Math.PI / 6, 0.5);
            pLightL.position.set(-0.6, 0.45, 2.1);
            pLightL.target.position.set(-0.6, 0.2, 10);
            scene.add(pLightL.target);

            const pLightR = pLightL.clone();
            pLightR.position.x = 0.6;
            pLightR.target.position.set(0.6, 0.2, 10);
            scene.add(pLightR.target);

            carGroup.add(pLightL);
            carGroup.add(pLightR);
            headlightPointLights.push(pLightL, pLightR);

            // 6. Taillights
            const tailGeo = new THREE.BoxGeometry(1.6, 0.06, 0.08);
            const tailMat = new THREE.MeshBasicMaterial({ color: 0xff0033 });
            const taillight = new THREE.Mesh(tailGeo, tailMat);
            taillight.position.set(0, 0.55, -2.06);
            carGroup.add(taillight);

            // 7. Neon Underglow Strips
            const neonMat = new THREE.MeshBasicMaterial({ color: 0x00f2fe });
            const neonGeo = new THREE.BoxGeometry(1.6, 0.02, 3.2);
            const neonStrip = new THREE.Mesh(neonGeo, neonMat);
            neonStrip.position.set(0, 0.08, 0);
            carGroup.add(neonStrip);

            const underGlowLight = new THREE.PointLight(0x00f2fe, 3, 5);
            underGlowLight.position.set(0, 0.1, 0);
            carGroup.add(underGlowLight);
            neonLights.push(neonStrip, underGlowLight);

            // 8. Wheels Assembly
            const wheelPositions = [
                [-0.95, 0.35, 1.25],  // Front Left
                [0.95, 0.35, 1.25],   // Front Right
                [-0.98, 0.38, -1.25], // Rear Left
                [0.98, 0.38, -1.25]   // Rear Right
            ];

            wheelPositions.forEach((pos) => {
                const wheelGroup = new THREE.Group();

                // Tire
                const tireGeo = new THREE.CylinderGeometry(0.36, 0.36, 0.28, 24);
                tireGeo.rotateZ(Math.PI / 2);
                const tireMat = new THREE.MeshStandardMaterial({ color: 0x181818, roughness: 0.8 });
                const tire = new THREE.Mesh(tireGeo, tireMat);
                tire.castShadow = true;
                wheelGroup.add(tire);

                // Rim Spokes
                const rimGeo = new THREE.BoxGeometry(0.3, 0.65, 0.04);
                const rim1 = new THREE.Mesh(rimGeo, chromeMaterial);
                rim1.position.x = pos[0] > 0 ? 0.02 : -0.02;
                const rim2 = rim1.clone();
                rim2.rotation.x = Math.PI / 3;
                const rim3 = rim1.clone();
                rim3.rotation.x = -Math.PI / 3;

                wheelGroup.add(rim1, rim2, rim3);

                // Brake Disc Caliper
                const brakeGeo = new THREE.CylinderGeometry(0.24, 0.24, 0.05, 16);
                brakeGeo.rotateZ(Math.PI / 2);
                const brakeMat = new THREE.MeshStandardMaterial({ color: 0xaa2222, roughness: 0.3 });
                const brake = new THREE.Mesh(brakeGeo, brakeMat);
                wheelGroup.add(brake);

                wheelGroup.position.set(pos[0], pos[1], pos[2]);
                carGroup.add(wheelGroup);
                wheelMeshes.push(wheelGroup);
            });

            scene.add(carGroup);
        }

        // -------------------------------------------------------------
        // Road Grid & Speed Particles
        // -------------------------------------------------------------
        function createEnvironment() {
            // Infinite Grid Floor
            roadGrid = new THREE.GridHelper(200, 100, 0x00f2fe, 0x112244);
            roadGrid.position.y = 0;
            scene.add(roadGrid);

            // Speed Dust Line Particles
            const particleCount = 200;
            const particleGeo = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);

            for (let i = 0; i < particleCount * 3; i += 3) {
                positions[i] = (Math.random() - 0.5) * 40;
                positions[i + 1] = Math.random() * 5;
                positions[i + 2] = (Math.random() - 0.5) * 100;
            }

            particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const particleMat = new THREE.PointsMaterial({
                color: 0x00f2fe,
                size: 0.15,
                transparent: true,
                opacity: 0.6
            });

            speedDust = new THREE.Points(particleGeo, particleMat);
            scene.add(speedDust);
        }

        // -------------------------------------------------------------
        // Audio Engine Synthesizer (Web Audio API)
        // -------------------------------------------------------------
        function initAudio() {
            if (audioCtx) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();

            engineOscillator = audioCtx.createOscillator();
            engineGain = audioCtx.createGain();

            engineOscillator.type = 'sawtooth';
            engineOscillator.frequency.setValueAtTime(60, audioCtx.currentTime);

            engineGain.gain.setValueAtTime(0.01, audioCtx.currentTime);

            engineOscillator.connect(engineGain);
            engineGain.connect(audioCtx.destination);
            engineOscillator.start();
        }

        function updateAudioEngine() {
            if (!soundEnabled || !audioCtx) return;
            const pitch = 50 + (speed / maxSpeed) * 350;
            const volume = 0.03 + (speed / maxSpeed) * 0.12;

            engineOscillator.frequency.setTargetAtTime(pitch, audioCtx.currentTime, 0.05);
            engineGain.gain.setTargetAtTime(volume, audioCtx.currentTime, 0.05);
        }

        document.getElementById('audioToggleBtn').addEventListener('click', () => {
            soundEnabled = !soundEnabled;
            const btn = document.getElementById('audioToggleBtn');
            if (soundEnabled) {
                initAudio();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                btn.textContent = '🔊 SFX: ON';
                btn.classList.add('active');
            } else {
                if (engineGain) engineGain.gain.setValueAtTime(0, audioCtx.currentTime);
                btn.textContent = '🔊 SFX: OFF';
                btn.classList.remove('active');
            }
        });

        // -------------------------------------------------------------
        // Acceleration & Driving Controls
        // -------------------------------------------------------------
        window.addEventListener('keydown', (e) => {
            if (e.key === 'w' || e.key === 'W' || e.key === 'ArrowUp') {
                isAccelerating = true;
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'w' || e.key === 'W' || e.key === 'ArrowUp') {
                isAccelerating = false;
            }
        });

        // Mobile Touch Gas Pedal
        const gasPedal = document.getElementById('gasPedal');
        gasPedal.addEventListener('touchstart', (e) => { e.preventDefault(); isAccelerating = true; });
        gasPedal.addEventListener('touchend', (e) => { e.preventDefault(); isAccelerating = false; });
        gasPedal.addEventListener('mousedown', () => isAccelerating = true);
        gasPedal.addEventListener('mouseup', () => isAccelerating = false);

        // -------------------------------------------------------------
        // UI Customization Interactivity
        // -------------------------------------------------------------
        // Sidebar Toggle
        document.getElementById('panelToggleBtn').addEventListener('click', () => {
            document.getElementById('controlsPanel').classList.toggle('collapsed');
        });

        // Color Picker
        document.querySelectorAll('.color-dot').forEach(dot => {
            dot.addEventListener('click', (e) => {
                document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
                dot.classList.add('active');

                const hexColor = dot.getAttribute('data-color');
                const name = dot.getAttribute('data-name');

                bodyMaterial.color.set(hexColor);
                document.getElementById('colorName').textContent = name;
            });
        });

        // Headlights Toggle
        let headlightsOn = true;
        document.getElementById('headlightsToggle').addEventListener('click', (e) => {
            headlightsOn = !headlightsOn;
            e.target.classList.toggle('active', headlightsOn);
            e.target.textContent = `💡 Фари: ${headlightsOn ? 'ON' : 'OFF'}`;
            headlightPointLights.forEach(l => l.visible = headlightsOn);
        });

        // Neon Underglow Toggle
        let neonOn = true;
        document.getElementById('neonToggle').addEventListener('click', (e) => {
            neonOn = !neonOn;
            e.target.classList.toggle('active', neonOn);
            e.target.textContent = `✨ Неон: ${neonOn ? 'ON' : 'OFF'}`;
            neonLights.forEach(l => l.visible = neonOn);
        });

        // Camera Angle Switcher
        document.querySelectorAll('[data-cam]').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('[data-cam]').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');

                const mode = btn.getAttribute('data-cam');
                if (mode === 'orbit') {
                    camera.position.set(4.5, 2.2, 5.5);
                    controls.target.set(0, 0.6, 0);
                } else if (mode === 'front') {
                    camera.position.set(0, 1.2, 5.0);
                    controls.target.set(0, 0.5, 0);
                } else if (mode === 'cockpit') {
                    camera.position.set(0, 0.85, 0.1);
                    controls.target.set(0, 0.8, 2.0);
                } else if (mode === 'wheel') {
                    camera.position.set(1.6, 0.5, 1.2);
                    controls.target.set(0.95, 0.35, 1.25);
                }
            });
        });

        // Environment Theme Switcher
        document.querySelectorAll('[data-env]').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('[data-env]').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');

                const env = btn.getAttribute('data-env');
                if (env === 'cyber') {
                    scene.fog.color.setHex(0x05070f);
                    renderer.setClearColor(0x05070f);
                    roadGrid.material.color.setHex(0x00f2fe);
                } else if (env === 'sunset') {
                    scene.fog.color.setHex(0x1a051d);
                    renderer.setClearColor(0x1a051d);
                    roadGrid.material.color.setHex(0xff0055);
                }
            });
        });

        // -------------------------------------------------------------
        // Resize Handler
        // -------------------------------------------------------------
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // -------------------------------------------------------------
        // Main Animation & Physics Loop
        // -------------------------------------------------------------
        function animate() {
            requestAnimationFrame(animate);

            // Acceleration Physics
            if (isAccelerating) {
                targetSpeed = maxSpeed;
                speed += (targetSpeed - speed) * 0.04;
            } else {
                targetSpeed = 0;
                speed += (targetSpeed - speed) * 0.06;
            }

            if (speed < 0.5) speed = 0;

            // UI Speedometer Update
            const displaySpeed = Math.round(speed);
            document.getElementById('speedDisplay').textContent = String(displaySpeed).padStart(3, '0');
            document.getElementById('rpmBar').style.width = `${(speed / maxSpeed) * 100}%`;

            // Update Audio Pitch
            updateAudioEngine();

            // Wheel Rotation & Grid Scrolling
            const wheelRotationSpeed = (speed / 360) * 0.6;
            wheelMeshes.forEach(w => w.children[0].rotation.x += wheelRotationSpeed);

            // Infinite Scrolling Road Effect
            if (roadGrid) {
                roadGrid.position.z = (roadGrid.position.z + wheelRotationSpeed * 3) % 2;
            }

            // Animate Speed Dust Particles
            if (speedDust) {
                const positions = speedDust.geometry.attributes.position.array;
                for (let i = 2; i < positions.length; i += 3) {
                    positions[i] += wheelRotationSpeed * 10;
                    if (positions[i] > 50) positions[i] = -50;
                }
                speedDust.geometry.attributes.position.needsUpdate = true;
            }

            // Engine Subtle Vibration effect
            if (carGroup && speed > 0) {
                carGroup.position.y = Math.sin(Date.now() * 0.02) * (speed / maxSpeed) * 0.02;
            }

            controls.update();
            renderer.render(scene, camera);
        }

        // Initialize App
        window.addEventListener('load', init);
    </script>
</body>
</html>
